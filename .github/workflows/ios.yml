name: Prepare iOS builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-ios:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [mobile_app, merchant_app]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build unsigned iOS application
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app unsigned-ios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: allinonetoday-${{ matrix.app }}-unsigned-ios
          path: apps/${{ matrix.app }}/unsigned-ios.zip
          if-no-files-found: error
          retention-days: 14
