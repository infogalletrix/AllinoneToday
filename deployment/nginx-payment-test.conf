# Android-only sandbox, separate from the public API.
location /payment-test/api/ {
    proxy_pass http://127.0.0.1:5090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /payment-test/uploads/ {
    proxy_pass http://127.0.0.1:5090/uploads/;
    proxy_set_header Host $host;
    add_header X-Content-Type-Options nosniff always;
}
location /payment-test/ { return 404; }
location = /payment-test { return 404; }
