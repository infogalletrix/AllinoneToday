# Review-only Flutter builds. No SPA fallback into the live marketplace.
location = /app-previews { return 301 /app-previews/; }
location = /app-previews/public { return 301 /app-previews/public/; }
location = /app-previews/business { return 301 /app-previews/business/; }
location ^~ /app-previews/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
}
