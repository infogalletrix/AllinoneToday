server {
    listen 80;
    listen [::]:80;
    server_name allinonetoday.galletrix.com;
    root /opt/allinonetoday/web;
    index index.html;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:5088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:5088;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
    }
    location /downloads/ { try_files $uri =404; }
    location /assets/ { expires 7d; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
