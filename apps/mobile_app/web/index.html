<!DOCTYPE html>
<html lang="en">
<head>

    body { margin: 0; background: #eaeef2; font-family: system-ui, sans-serif; color: #14171c; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
